name: Make daily episode

on:
  schedule:
    - cron: "7 22 * * *"   # 06:07 Malaysia time every day
  push:            # setup phase only: lets fixes to the pipeline test themselves
    branches: [main]
    paths: ["scripts/**", ".github/workflows/daily.yml"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode id (YYYY-MM-DD). Leave empty for today."
        required: false
      feedback:
        description: "Notes for a remake (optional)"
        required: false

permissions:
  contents: write   # save episode files back to the repo
  models: read      # free GitHub Models for script writing

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INPUT_EPISODE: ${{ inputs.episode }}
      INPUT_FEEDBACK: ${{ inputs.feedback }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick episode id
        id: ep
        run: |
          EP="$(echo "$INPUT_EPISODE" | tr -d '[:space:]')"
          if [[ ! "$EP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            [ -n "$EP" ] && echo "Episode box had '$EP' (not YYYY-MM-DD) — using today instead"
            EP=$(TZ=Asia/Kuala_Lumpur date +%F)
          fi
          echo "Episode: $EP"
          echo "id=$EP" >> "$GITHUB_OUTPUT"
          STATUS=$(python3 -c "import json,sys;print(json.load(open('episodes/$EP/status.json')).get('status',''))" 2>/dev/null || true)
          # on the daily schedule, don't remake an episode that already exists
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$STATUS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Episode $EP already $STATUS — skipping"
          fi

      - uses: actions/setup-python@v5
        if: steps.ep.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tools
        if: steps.ep.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: Cache voice
        if: steps.ep.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: build/voices
          key: piper-${{ hashFiles('config.yaml') }}

      - name: Make placeholder art if none yet
        if: steps.ep.outputs.skip != 'true'
        run: |
          [ -f assets/poses/happy.png ] || python scripts/make_placeholders.py

      - name: Write script
        if: steps.ep.outputs.skip != 'true'
        run: set -o pipefail; mkdir -p build; python scripts/write_script.py --episode "${{ steps.ep.outputs.id }}" --feedback "$INPUT_FEEDBACK" 2>&1 | tee -a build/log.txt

      - name: Make voice
        if: steps.ep.outputs.skip != 'true'
        run: set -o pipefail; mkdir -p build; python scripts/make_voice.py --episode "${{ steps.ep.outputs.id }}" 2>&1 | tee -a build/log.txt

      - name: Render video
        if: steps.ep.outputs.skip != 'true'
        run: set -o pipefail; mkdir -p build; python scripts/render_video.py --episode "${{ steps.ep.outputs.id }}" 2>&1 | tee -a build/log.txt

      - name: Keep a copy of the video (30 days)
        if: steps.ep.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ steps.ep.outputs.id }}-${{ github.run_attempt }}-${{ github.run_id }}
          path: build/${{ steps.ep.outputs.id }}/final.mp4
          retention-days: 30

      - name: Send to Telegram for approval
        if: steps.ep.outputs.skip != 'true'
        run: set -o pipefail; mkdir -p build; python scripts/telegram_bot.py send --episode "${{ steps.ep.outputs.id }}" 2>&1 | tee -a build/log.txt

      - name: Save episode files
        if: steps.ep.outputs.skip != 'true'
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add episodes topics.txt assets state
          git diff --cached --quiet || git commit -m "Episode ${{ steps.ep.outputs.id }}"
          git pull --rebase --autostash -q && git push -q

      - name: Report failure
        if: failure()
        run: |
          mkdir -p state build
          touch build/log.txt
          # show the error as an annotation on the run page
          MSG=$(tail -n 25 build/log.txt | sed -e ':a;N;$!ba' -e 's/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Episode failed::$MSG"
          { echo "Today's episode failed."; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; tail -n 40 build/log.txt; } > state/last_error.txt
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "::warning::TELEGRAM_BOT_TOKEN secret is empty"; fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then echo "::warning::TELEGRAM_CHAT_ID secret is empty"; fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            tail -c 3500 state/last_error.txt > build/tg.txt
            RESP=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text@build/tg.txt" || true)
            echo "::notice title=Telegram reply::$(echo "$RESP" | head -c 300)"
          fi
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/last_error.txt
          git commit -q -m "Log failed run" && git pull --rebase --autostash -q && git push -q || echo "::warning::could not save error log"
